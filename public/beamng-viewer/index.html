<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MapNG BeamNG Viewer</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;background:#08131f;font-family:Inter,Segoe UI,Arial,sans-serif}
    .panel{position:absolute;z-index:10;top:14px;left:14px;width:360px;padding:14px;border-radius:12px;background:rgba(14,23,34,.95);color:#edf5ff;border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 32px rgba(0,0,0,.4)}
    h1{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:#a9b8cb;margin-bottom:12px}.drop{display:block;border:1px dashed #ff7a21;border-radius:10px;padding:16px;text-align:center;cursor:pointer;background:#122235}.drop.drag{background:#18314b}.drop input{display:none}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;background:#26384e;color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px;cursor:pointer}.status{font-size:12px;line-height:1.45;margin-top:10px;color:#c7d5e8}.error{color:#ff9b9b}
  </style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>MapNG BeamNG Viewer</h1>
  <div class="sub">Online Cesium preview bez inštalácie</div>
  <label class="drop" id="drop">Pretiahni sem MapNG preview ZIP<br><small>scene.json + terrain_*.bin + terrain.png</small><input id="file" type="file" accept=".zip" /></label>
  <div class="row"><button id="home">Celá mapa</button><button id="top">Pohľad zhora</button></div>
  <div id="status" class="status">Čakám na preview ZIP.</div>
</div>
<script type="module">
const status=document.querySelector('#status');
const drop=document.querySelector('#drop');
const input=document.querySelector('#file');
let viewer,terrainPrimitive,roads=[],meta;
function fail(e){console.error(e);status.className='status error';status.textContent='Chyba: '+e.message}
function ensureViewer(){
  if(viewer)return viewer;
  viewer=new Cesium.Viewer('map',{baseLayer:new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'})),terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:false,homeButton:false,baseLayerPicker:false});
  viewer.scene.globe.depthTestAgainstTerrain=true;
  return viewer;
}
function fly(top=false){if(!viewer||!meta)return;viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(meta.center[0],meta.center[1],top?4300:meta.maxElevation+1900),orientation:{heading:top?0:Cesium.Math.toRadians(25),pitch:Cesium.Math.toRadians(top?-90:-38),roll:0},duration:1.1})}
async function loadZip(file){
  status.className='status';status.textContent='Načítavam '+file.name+'…';
  const zip=await JSZip.loadAsync(file);
  const find=(name)=>Object.values(zip.files).find(f=>!f.dir&&f.name.endsWith(name));
  const sceneFile=find('assets/scene.json')||find('scene.json');
  const geoFile=find('terrain_lon_lat_height.bin');
  const stFile=find('terrain_st.bin');
  const indexFile=find('terrain_indices.bin');
  const textureFile=find('terrain.png');
  if(!sceneFile||!geoFile||!stFile||!indexFile||!textureFile)throw new Error('ZIP nemá požadovaný MapNG V4 preview formát.');
  const scene=JSON.parse(await sceneFile.async('text'));meta=scene.meta;
  const [geoBuf,stBuf,indexBuf,textureBlob]=await Promise.all([geoFile.async('arraybuffer'),stFile.async('arraybuffer'),indexFile.async('arraybuffer'),textureFile.async('blob')]);
  const geographic=new Float64Array(geoBuf),st=new Float32Array(stBuf),indices=new Uint32Array(indexBuf),ecef=new Float64Array(geographic.length);
  for(let i=0;i<geographic.length/3;i++){const p=Cesium.Cartesian3.fromDegrees(geographic[i*3],geographic[i*3+1],geographic[i*3+2]);ecef[i*3]=p.x;ecef[i*3+1]=p.y;ecef[i*3+2]=p.z}
  ensureViewer();
  if(terrainPrimitive)viewer.scene.primitives.remove(terrainPrimitive);roads.forEach(e=>viewer.entities.remove(e));roads=[];
  const geometry=new Cesium.Geometry({attributes:{position:new Cesium.GeometryAttribute({componentDatatype:Cesium.ComponentDatatype.DOUBLE,componentsPerAttribute:3,values:ecef}),st:new Cesium.GeometryAttribute({componentDatatype:Cesium.ComponentDatatype.FLOAT,componentsPerAttribute:2,values:st})},indices,primitiveType:Cesium.PrimitiveType.TRIANGLES,boundingSphere:Cesium.BoundingSphere.fromVertices(ecef)});
  const textureUrl=URL.createObjectURL(textureBlob);
  terrainPrimitive=viewer.scene.primitives.add(new Cesium.Primitive({geometryInstances:new Cesium.GeometryInstance({geometry}),appearance:new Cesium.MaterialAppearance({material:Cesium.Material.fromType('Image',{image:textureUrl,repeat:new Cesium.Cartesian2(1,1)}),translucent:false,faceForward:true}),asynchronous:false}));
  for(const road of scene.roads||[]){const e=viewer.entities.add({name:road.name||'BeamNG road',polyline:{positions:road.coordinates.map(c=>Cesium.Cartesian3.fromDegrees(c[0],c[1],c[2]+.45)),width:Math.max(2,road.width||4),material:new Cesium.PolylineGlowMaterialProperty({glowPower:.12,color:Cesium.Color.fromCssColorString('#ffd34e')}),clampToGround:false}});roads.push(e)}
  status.innerHTML=`<b>${file.name}</b><br>${meta.worldSize} × ${meta.worldSize} m · ${roads.length} ciest<br>Terrain: WGS84 → ECEF`;
  fly(false);
}
input.onchange=()=>input.files[0]&&loadZip(input.files[0]).catch(fail);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');e.dataTransfer.files[0]&&loadZip(e.dataTransfer.files[0]).catch(fail)};
document.querySelector('#home').onclick=()=>fly(false);document.querySelector('#top').onclick=()=>fly(true);
</script>
</body>
</html>
