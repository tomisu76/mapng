<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MapNG World 3D Viewer</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;background:#08131f;font-family:Inter,Segoe UI,Arial,sans-serif}
    .panel{position:absolute;z-index:10;top:14px;left:14px;width:380px;max-height:calc(100vh - 28px);overflow:auto;padding:14px;border-radius:12px;background:rgba(14,23,34,.95);color:#edf5ff;border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 32px rgba(0,0,0,.4)}
    h1{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:#a9b8cb;margin-bottom:12px}.drop{display:block;border:1px dashed #ff7a21;border-radius:10px;padding:14px;text-align:center;cursor:pointer;background:#122235}.drop.drag{background:#18314b}.drop input{display:none}
    .row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;background:#26384e;color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px;cursor:pointer}.row button.active{background:#c85d19;border-color:#ff9b5e}.row button:disabled{opacity:.45;cursor:not-allowed}
    .group{margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.12)}.group-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#91a4ba;margin-bottom:7px}.control{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:7px 0;font-size:13px}.control input[type=range]{width:165px}.control input[type=checkbox]{width:16px;height:16px}
    .status{font-size:12px;line-height:1.5;margin-top:10px;color:#c7d5e8}.error{color:#ff9b9b}.ok{color:#8fe3a7}.warn{color:#ffd083}.hint{font-size:11px;line-height:1.45;color:#8fa2b8;margin-top:9px}.value{min-width:35px;text-align:right;color:#ffb27f;font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>MapNG World 3D Viewer</h1>
  <div class="sub">OSM svet sa načíta automaticky; globálny 3D terén sa zapne na pozadí.</div>
  <div class="row"><button id="world">Celý svet</button><button id="slovakia">Slovensko 3D</button><button id="lighting">Osvetlenie</button></div>
  <label class="drop" id="drop">Voliteľne pretiahni MapNG preview ZIP<br><small>scene.json + terrain_*.bin + terrain.png</small><input id="file" type="file" accept=".zip" /></label>
  <div class="row"><button id="view3d" disabled>Projekt 3D</button><button id="top" disabled>Projekt zhora</button><button id="orbit" disabled>Rotácia</button></div>
  <div class="group">
    <div class="group-title">MapNG projekt</div>
    <label class="control"><span>Zobraziť terén</span><input id="terrainVisible" type="checkbox" checked disabled /></label>
    <label class="control"><span>Zobraziť textúru</span><input id="textureVisible" type="checkbox" checked disabled /></label>
    <label class="control"><span>Zobraziť cesty</span><input id="roadsVisible" type="checkbox" checked disabled /></label>
    <label class="control"><span>Výškové zvýraznenie</span><span><input id="exaggeration" type="range" min="1" max="5" step="0.25" value="1" disabled /><span id="exaggerationValue" class="value">1.00×</span></span></label>
  </div>
  <div id="status" class="status">Načítavam OSM svet a globálny 3D terén…</div>
  <div class="hint">Svet funguje aj bez ZIP súboru. Vyhľadávanie miest je dostupné v pravom hornom rohu mapy.</div>
</div>
<script type="module">
const $=s=>document.querySelector(s),status=$('#status'),drop=$('#drop'),input=$('#file');
const projectControls=['view3d','top','orbit','terrainVisible','textureVisible','roadsVisible','exaggeration'].map(id=>$('#'+id));
let viewer,projectTerrain,roads=[],meta,sourceGeographic,sourceSt,sourceIndices,textureUrl,orbitTimer=null,worldTerrain3d=false;
function setProjectEnabled(v){projectControls.forEach(c=>c.disabled=!v)}
function setStatus(text,cls=''){status.className='status '+cls;status.innerHTML=text}
function initWorld(){
  viewer=new Cesium.Viewer('map',{
    baseLayer:new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'})),
    terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,geocoder:true,homeButton:false,
    baseLayerPicker:false,sceneModePicker:true,navigationHelpButton:true,fullscreenButton:false
  });
  viewer.scene.globe.depthTestAgainstTerrain=true;viewer.scene.fxaa=true;viewer.scene.screenSpaceCameraController.minimumZoomDistance=20;
  viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(15,25,21000000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-90),roll:0}});
  enableWorldTerrain();
}
async function enableWorldTerrain(){
  const url='https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer';
  try{
    const provider=await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(url);
    viewer.terrainProvider=provider;viewer.scene.globe.enableLighting=true;worldTerrain3d=true;
    setStatus('<span class="ok">✓ OSM svet a globálny 3D terén sú pripravené.</span><br>Priblíž sa ku kopcom a nakloň kameru.');
  }catch(error){
    console.warn('Global terrain unavailable',error);worldTerrain3d=false;
    setStatus('<span class="warn">OSM svet je pripravený, ale globálny 3D terén sa nepodarilo načítať.</span><br>MapNG ZIP terén bude naďalej fungovať.','warn');
  }
}
function flyWorld(){viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(15,25,21000000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-90),roll:0},duration:1.3})}
function flySlovakia(){viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(19.3,48.8,330000),orientation:{heading:Cesium.Math.toRadians(10),pitch:Cesium.Math.toRadians(-48),roll:0},duration:1.5})}
function cameraProject(top=false){if(!meta)return;const h=top?Math.max(3500,(meta.worldSize||2048)*1.9):Math.max(1300,(meta.worldSize||2048)*.95);viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(meta.center[0],meta.center[1],(meta.maxElevation||0)+h),orientation:{heading:top?0:Cesium.Math.toRadians(32),pitch:Cesium.Math.toRadians(top?-90:-42),roll:0},duration:1.15})}
function stopOrbit(){if(orbitTimer){clearInterval(orbitTimer);orbitTimer=null}$('#orbit').classList.remove('active');$('#orbit').textContent='Rotácia'}
function toggleOrbit(){if(orbitTimer)return stopOrbit();if(!meta)return;$('#orbit').classList.add('active');$('#orbit').textContent='Zastaviť';orbitTimer=setInterval(()=>viewer.camera.rotateRight(Cesium.Math.toRadians(.12)),30)}
function appearance(){const use=$('#textureVisible').checked;const material=use&&textureUrl?Cesium.Material.fromType('Image',{image:textureUrl,repeat:new Cesium.Cartesian2(1,1)}):Cesium.Material.fromType('Color',{color:new Cesium.Color(.43,.55,.39,1)});return new Cesium.MaterialAppearance({material,translucent:false,faceForward:true,flat:false})}
function rebuildProjectTerrain(){
  if(!sourceGeographic)return;if(projectTerrain)viewer.scene.primitives.remove(projectTerrain);
  const ex=Number($('#exaggeration').value),base=Number.isFinite(meta.minElevation)?meta.minElevation:0,ecef=new Float64Array(sourceGeographic.length);
  for(let i=0;i<sourceGeographic.length/3;i++){const h=base+(sourceGeographic[i*3+2]-base)*ex,p=Cesium.Cartesian3.fromDegrees(sourceGeographic[i*3],sourceGeographic[i*3+1],h);ecef[i*3]=p.x;ecef[i*3+1]=p.y;ecef[i*3+2]=p.z}
  let geometry=new Cesium.Geometry({attributes:{position:new Cesium.GeometryAttribute({componentDatatype:Cesium.ComponentDatatype.DOUBLE,componentsPerAttribute:3,values:ecef}),st:new Cesium.GeometryAttribute({componentDatatype:Cesium.ComponentDatatype.FLOAT,componentsPerAttribute:2,values:sourceSt})},indices:sourceIndices,primitiveType:Cesium.PrimitiveType.TRIANGLES,boundingSphere:Cesium.BoundingSphere.fromVertices(ecef)});
  try{geometry=Cesium.GeometryPipeline.computeNormal(geometry)}catch{}
  projectTerrain=viewer.scene.primitives.add(new Cesium.Primitive({geometryInstances:new Cesium.GeometryInstance({geometry}),appearance:appearance(),asynchronous:false,show:$('#terrainVisible').checked}));
}
async function loadZip(file){
  stopOrbit();setStatus('Načítavam '+file.name+'…');const zip=await JSZip.loadAsync(file),find=name=>Object.values(zip.files).find(f=>!f.dir&&f.name.endsWith(name));
  const sf=find('assets/scene.json')||find('scene.json'),gf=find('terrain_lon_lat_height.bin'),stf=find('terrain_st.bin'),inf=find('terrain_indices.bin'),tf=find('terrain.png');
  if(!sf||!gf||!stf||!inf||!tf)throw new Error('ZIP nemá MapNG V4 preview formát.');
  const scene=JSON.parse(await sf.async('text'));meta=scene.meta||{};const [gb,sb,ib,tb]=await Promise.all([gf.async('arraybuffer'),stf.async('arraybuffer'),inf.async('arraybuffer'),tf.async('blob')]);
  sourceGeographic=new Float64Array(gb);sourceSt=new Float32Array(sb);sourceIndices=new Uint32Array(ib);if(textureUrl)URL.revokeObjectURL(textureUrl);textureUrl=URL.createObjectURL(tb);
  roads.forEach(e=>viewer.entities.remove(e));roads=[];(scene.roads||[]).forEach(r=>roads.push(viewer.entities.add({name:r.name||'BeamNG road',polyline:{positions:r.coordinates.map(c=>Cesium.Cartesian3.fromDegrees(c[0],c[1],c[2]+.7)),width:Math.max(2,r.width||4),material:new Cesium.PolylineGlowMaterialProperty({glowPower:.12,color:Cesium.Color.fromCssColorString('#ffd34e')})}})));
  rebuildProjectTerrain();setProjectEnabled(true);setStatus(`<b>${file.name}</b><br>${roads.length} ciest · ${(sourceGeographic.length/3).toLocaleString('sk-SK')} vrcholov<br>Globálny terén: ${worldTerrain3d?'3D':'plochý fallback'} · MapNG terén: 3D`);cameraProject(false);
}
input.addEventListener('change',()=>input.files[0]&&loadZip(input.files[0]).catch(e=>setStatus('Chyba: '+e.message,'error')));
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');e.dataTransfer.files[0]&&loadZip(e.dataTransfer.files[0]).catch(x=>setStatus('Chyba: '+x.message,'error'))});
$('#world').addEventListener('click',flyWorld);$('#slovakia').addEventListener('click',flySlovakia);$('#lighting').addEventListener('click',()=>{viewer.scene.globe.enableLighting=!viewer.scene.globe.enableLighting;$('#lighting').classList.toggle('active',viewer.scene.globe.enableLighting)});
$('#view3d').addEventListener('click',()=>cameraProject(false));$('#top').addEventListener('click',()=>cameraProject(true));$('#orbit').addEventListener('click',toggleOrbit);
$('#terrainVisible').addEventListener('change',()=>{if(projectTerrain)projectTerrain.show=$('#terrainVisible').checked});$('#roadsVisible').addEventListener('change',()=>roads.forEach(e=>e.show=$('#roadsVisible').checked));$('#textureVisible').addEventListener('change',rebuildProjectTerrain);
$('#exaggeration').addEventListener('input',()=>$('#exaggerationValue').textContent=Number($('#exaggeration').value).toFixed(2)+'×');$('#exaggeration').addEventListener('change',rebuildProjectTerrain);
initWorld();
</script>
</body>
</html>
